info:
  name: Didomi Client Libraries and Distributions
  provider: didomi
  description: >-
    First-party Didomi SDKs and client libraries. Didomi's CMP/PMP is delivered
    primarily as platform SDKs (Web, Android, iOS/tvOS, React Native, Flutter,
    Unity, Vega OS) rather than as REST API clients — there is NO first-party
    client library for the Didomi Platform REST API at https://api.didomi.io/v1.
    Consumers of the REST API call it directly with an HTTP client.
  docs: https://developers.didomi.io/
  registries_checked:
  - npm (registry.npmjs.org)
  - pub.dev
  - Maven Central (repo1.maven.org)
  - CocoaPods trunk
  - Swift Package Manager (GitHub tags)
  - crates.io
  - Packagist
  - pkg.go.dev / proxy.golang.org
  - NuGet
  checked: '2026-08-13'
packages:
- name: io.didomi.sdk:android
  registry: maven
  official: true
  language: Kotlin/Java
  surface: CMP Mobile SDK (Android / Android TV)
  url: https://repo1.maven.org/maven2/io/didomi/sdk/android/
  install: "implementation 'io.didomi.sdk:android:2.47.0'"
  version: 2.47.0
  published: '2026-08-03'
  docs: https://developers.didomi.io/cmp/mobile-sdk/android/setup
  note: >-
    Version and date read from repo1.maven.org/maven2/io/didomi/sdk/android/maven-metadata.xml
    (lastUpdated 20260803093308); the same 2.47.0 coordinate is the one Didomi's
    own Android setup page publishes.
- name: Didomi-XCFramework
  registry: cocoapods
  official: true
  language: Swift/Objective-C
  surface: CMP Mobile SDK (iOS / tvOS)
  url: https://cocoapods.org/pods/Didomi-XCFramework
  install: "pod 'Didomi-XCFramework', '2.47.0'"
  version: 2.47.0
  published: null
  docs: https://developers.didomi.io/cmp/mobile-sdk/ios/setup
  note: >-
    2.47.0 is the version Didomi's iOS setup page publishes. The CocoaPods trunk
    API (trunk.cocoapods.org/api/v1/pods/Didomi-XCFramework) returns a version
    list whose tail stops at 2.9.2 (2024-07-02), so no publish date could be
    read for 2.47.0 from the registry — recorded as null rather than guessed.
    Pod owner is listed as "Tech Team" (Didomi).
- name: didomi-ios-sdk-spm
  registry: swift-pm
  official: true
  language: Swift
  surface: CMP Mobile SDK (iOS / tvOS) via Swift Package Manager
  url: https://github.com/didomi/didomi-ios-sdk-spm
  install: 'Xcode > Package Dependencies > https://github.com/didomi/didomi-ios-sdk-spm'
  version: 2.47.0
  published: '2026-08-03'
  docs: https://developers.didomi.io/cmp/mobile-sdk/ios/setup
  note: >-
    Swift Package Manager has no central registry; version read from the latest
    git tag on the first-party repo (2.47.0), date from the repo's last push.
