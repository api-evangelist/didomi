- name: Didomi Web SDK loader
  registry: cdn
  official: true
  language: JavaScript
  surface: CMP Web SDK (browser + CTV)
  url: https://sdk.privacy-center.org/{apiKey}/loader.js
  version: null
  published: null
  note: >-
    UNPINNED. The documented embed snippet loads
    https://sdk.privacy-center.org/{{Your-API-Key}}/loader.js with no version
    segment, so the browser always receives whatever Didomi has currently
    deployed — a consumer cannot tell which build they are running, and neither
    can we. Didomi does publish a human-readable version history at
    https://developers.didomi.io/cmp/web-sdk/reference/versions (latest entry
    1.5.2 at the time of this check) but that number is not addressable in the
    distribution URL. The CSP allowlist Didomi documents is
    https://sdk.privacy-center.org/ and https://api.privacy-center.org/.
- name: Didomi iOS XCFramework (direct download)
  registry: cdn
  official: true
  language: Swift
  surface: CMP Mobile SDK (iOS / tvOS), manual install
  url: https://sdk.didomi.io/ios/didomi-ios-sdk-X.Y.Z-xcframework.zip
  version: 2.47.0
  published: null
  note: >-
    Version-templated download documented on the iOS setup page; the URL is
    pinned by the consumer (X.Y.Z), so the distribution itself is versioned but
    carries no registry metadata endpoint to read a publish date from.
absent:
- registry: crates.io
  note: >-
    github.com/didomi/consent-string-decoder-rust exists (last pushed
    2026-05-26) but is not published to crates.io — crates.io/api/v1/crates
    returns 404 for the obvious names.
- registry: pkg.go.dev
  note: >-
    github.com/didomi/consent-string-golang exists but proxy.golang.org returns
    404 for it; the repo carries no tags, so there is no importable module version.
- registry: packagist
  note: >-
    github.com/didomi/magento (Magento 2 extension, last pushed 2023-08-27) is
    not published on Packagist under didomi/magento or didomi/magento2.
- registry: nuget
  note: No first-party Didomi package found; the Unity plugin ships via GitHub releases.
notes:
- >-
  There is no first-party SDK for the Didomi Platform REST API
  (https://api.didomi.io/v1). Every package above wraps the client-side CMP/PMP,
  not the management API. API consumers hand-roll HTTP calls against the
  OpenAPI at https://api.didomi.io/openapi.json.
- >-
  The mobile SDKs are on a tight release cadence (Android 2.47.0 on 2026-08-03,
  Flutter 2.31.0 on 2026-08-05, React Native 2.32.0 on 2026-08-04, Unity 2.29.0
  on 2026-08-04) — no abandonment signal on any first-party surface.
- >-
  Third-party packages matching "didomi" on npm (n8n-nodes-didomi,
  @orfon/didomi-types, @teklakct/didomi-react, cordova-plugin-didomi,
  @libconsent/didomi, @thg-altitude/didomi-consent) are community-published and
  are deliberately NOT listed above.
