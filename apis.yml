    browser, native mobile, CTV, in-game, and AMP surfaces.
- aid: didomi:didomi-consent-string-toolkit
  name: Didomi Consent String Toolkit
  tags:
  - Consent String
  - Decoder
  - Encoder
  - IAB TCF
  - Toolkit
  humanURL: https://developers.didomi.io/cmp/didomi-consent-string
  properties:
  - type: Documentation
    url: https://developers.didomi.io/cmp/didomi-consent-string
  - type: Documentation
    url: https://developers.didomi.io/cmp/didomi-consent-string/didomi-consent-string-structure
  - type: Documentation
    url: https://developers.didomi.io/cmp/didomi-consent-string/consent-string-examples
  - type: GitHubRepository
    url: https://github.com/didomi/consent-string
  - type: GitHubRepository
    url: https://github.com/didomi/consent-string-schema
  - type: GitHubRepository
    url: https://github.com/didomi/consent-string-decoder-rust
  - type: GitHubRepository
    url: https://github.com/didomi/consent-string-golang
  - type: GitHubRepository
    url: https://github.com/didomi/iabtcf-es
  description: >-
    Open-source libraries published under github.com/didomi for encoding, decoding, and validating the
    Didomi consent string and the IAB TCF v2 consent string. Includes TypeScript (`consent-string`, `consent-string-schema`),
    Rust with C/Java FFI (`consent-string-decoder-rust`), Go (`consent-string-golang`), and a fork of
    the official IAB tooling (`iabtcf-es`). Useful for server-side auditing, downstream ad-tech reading
    consent state, and offline analysis.
