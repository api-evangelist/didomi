  description: >-
    Didomi's Android and Android TV SDK delivers native consent notices, preference popups, and TCF /
    GPP / Didomi consent string generation in Java / Kotlin / Jetpack Compose apps. It shares consent
    with WebViews, bridges to Google Consent Mode v2, and ships with sample apps in Java, Kotlin, and
    Compose.
