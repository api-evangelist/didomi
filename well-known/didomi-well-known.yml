source: live HTTP probes of every Didomi host named in apis.yml and openapi servers[]
info:
  name: Didomi /.well-known probe
  provider: didomi
  description: >-
    Didomi serves no /.well-known document on any host we could reach. Every
    RFC 8615 path returned 404 on api.didomi.io, developers.didomi.io and
    www.didomi.io. console.didomi.io answers HTTP 200 with the same 19,425-byte
    single-page-app HTML shell for EVERY path under /.well-known/ — that is an
    SPA catch-all, not a document, and it is recorded here as a miss.
  result: no-hit
  checked: '2026-08-13'
