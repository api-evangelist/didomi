notes:
- >-
  NO WellKnown or SecurityTxt pointer is emitted in apis.yml from this file. The
  probe records an absence, and a recorded absence must never be wired as a
  presence.
- >-
  Didomi DOES run a security contact and a disclosure route, just not at
  /.well-known/security.txt — see security/didomi-vulnerability-disclosure.yml
  (security@didomi.io, documented at https://www.didomi.io/security). Publishing
  a security.txt on didomi.io and api.didomi.io is the single cheapest fix
  available to them here.
- >-
  No OAuth metadata is expected: the Platform API authenticates with a bearer
  JWT minted by POST /v1/sessions, not with OAuth 2.0. See
  authentication/didomi-authentication.yml.
