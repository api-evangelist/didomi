  retryable: true
coverage:
  operations_in_spec: 190
  operations_declaring_any_4xx: 21
  operations_declaring_any_5xx: 11
  note: >-
    169 of 190 operations declare no error response at all — only a 200 or 204.
    The error envelope is uniform across the API, so the omission is
    documentation debt rather than behavioural inconsistency, but it means a
    client generated from this spec has no error type to deserialize into on the
    overwhelming majority of calls.
gaps:
- No RFC 9457 application/problem+json, no dereferenceable `type` URI.
- No stable machine-readable error CODE beyond the HTTP status; `name` is a restatement of the status.
- 429 is documented in prose but absent from all 190 operations in the spec.
- No error-reference page enumerating specific `message` values.
- No `errors[]` item schema — the field is documented as "an array containing more errors" with no shape.
