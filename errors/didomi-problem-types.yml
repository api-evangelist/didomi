- status: 500
  name: InternalServerError
  title: General error
  spec_descriptions:
  - general error
  - Internal server error
  occurrences_in_spec: 11
  meaning: A Didomi server-side failure.
  remediation: >-
    Retry with exponential backoff. Check https://status.didomi.io before
