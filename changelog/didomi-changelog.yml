info:
  name: Didomi change log
  provider: didomi
  description: >-
    Didomi publishes a per-SDK version history. The MOBILE histories are dated
    ("2.47.0 (August 3, 2026)"); the WEB history is a changesets-style list with
    versions and change classes but NO dates. There is no changelog for the
    Didomi Platform REST API at all — the only published API change record is a
    one-off migration page for the multi-regulation notice configuration change.
  scheme: semver
  window: recent entries only
  checked: '2026-08-13'
