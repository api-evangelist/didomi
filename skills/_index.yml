warnings:
- >-
  NO IDEMPOTENCY. Didomi publishes no Idempotency-Key header on any write route,
  including POST /consents/events. Every skill that writes says so and offers a
  metadata-correlation workaround; none of them can promise safe retry.
- >-
  A Didomi API key grants full organization access. There are no OAuth scopes
  and no way to mint a reduced-privilege token, so an agent holding a key holds
  everything the key holds. Scope at the key, in the Console.
