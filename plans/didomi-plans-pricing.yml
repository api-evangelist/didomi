pricing_note: >-
  Didomi publishes NAMED TIERS with itemised inclusions but NO PRICES. Every
  tier below reads "Contact for pricing" on https://www.didomi.io/offers, with a
  single exception: the Server-Side Tagging Free plan, which is genuinely free
  and quotes an included volume (100,000 requests). No currency, billing period
  or unit price is published anywhere on the offers page. Re-read on
  2026-08-13; the tier NAMES and inclusions below are quoted from that page.
