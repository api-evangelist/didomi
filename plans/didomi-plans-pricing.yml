info:
  name: Didomi Plans and Pricing
  description: >-
    Didomi publicly advertises product modules (CMP, Preference Management
    Platform, Privacy Requests, Compliance Monitoring, Addingwell server-side
    tagging) but does not publish dollar pricing on a self-serve page; all
    commercial plans are quoted via the sales team at /contact-us and
    /offers. This file captures the publicly visible structure of the
    commercial offering as a starting point — pricing values are
    unpublished/quote-based.
  provider: didomi
  modified: '2026-05-25'
  sources:
  - https://www.didomi.io/offers
  - https://www.didomi.io/contact-us
  - https://www.didomi.io
plans:
- id: cmp
  name: Consent Management Platform
  pricing_model: contact-sales
  description: >-
    Didomi's flagship multi-regulation Consent Management Platform for
    publishers, advertisers, retailers, and large enterprises. Covers GDPR,
    CCPA / US state laws, IAB TCF v2.x, IAB GPP, GPC, Google Consent Mode v2,
    Amazon Consent Signal, Microsoft UET Consent Mode, and other regimes.
  surfaces:
  - Web SDK
  - iOS / tvOS SDK
  - Android / Android TV SDK
  - React Native, Flutter, Unity, Vega OS, AMP plugins
  - Console
  - Platform API (CMP scope)
  tiers:
  - name: Essential
    price: null
    currency: null
    billing_period: null
    pricing_model: contact-sales
    metered_on: Monthly Unique Visitors
    included:
    - Unlimited domains (metered on Monthly Unique Visitors)
    - Multi-regulation compliance support
    - Customized content and branding
    - Cross-domain / cross-device consent synchronization
  - name: Advanced
    price: null
    pricing_model: contact-sales
    included:
    - Everything in Essential
    - Advanced Compliance Monitoring module
    - White labelling
    - 'Analytics exports: 1 destination'
  - name: Premium
    price: null
    pricing_model: contact-sales
    included:
    - Everything in Advanced
    - Preference Management Platform
    - Server-side tagging
    - 'Analytics exports: 2 destinations'
    note: >-
      The exports_destinations quota default of 2 in the API docs lines up
      exactly with the Premium tier's "2 destinations".
- id: ctv
  name: Connected TV Consent Management
  pricing_model: contact-sales
  price: null
  description: >-
    Native CTV/OTT consent, sold as its own line. Matches the Vega OS SDK and
    the heavy CTV/HbbTV work visible in the recent Web SDK changelog.
  included:
  - Native CTV / OTT consent integration
  - Notice personalization
  - Consent proofs and analytics
  - Cross-device consent synchronization
- id: pmp
  name: Preference Management Platform
  pricing_model: contact-sales
  description: >-
    Custom preference centers, headless preference widgets, marketing-channel
    opt-in flows, and authenticated-user preference storage. Sold separately
    from the CMP and per Didomi's docs the underlying Consents API and
    integrations are priced separately.
  surfaces:
  - Privacy Widgets
  - Headless widgets
  - Platform API (Widgets scope)
  metered_on: user database size and API call volume
  included:
  - Headless widget customization
  - Preference analytics
  - Native integrations (Salesforce, HubSpot, Mailchimp and others)
  - Preference proofs
  - Privacy request handling
- id: privacy-requests
  name: Privacy Requests
  pricing_model: contact-sales
  description: >-
    DSAR intake, internal workflow, identity verification, structured
    response, and audit-grade evidence for GDPR Articles 15-22 and CCPA /
    US-state delete / opt-out rights.
- id: compliance-monitoring
  name: Advanced Compliance Monitoring
  pricing_model: contact-sales
  description: >-
    Continuous scanning of websites and apps for vendor coverage, unauthorized
    tags, and CMP misconfigurations, surfaced as CSV / Excel compliance
    reports.
  metered_on: number of scans
  included:
  - Daily / weekly / monthly scan frequency
  - Multi-scenario compliance detection
  - Cookie list extraction
  - Compliance notifications
  - Vendor synchronization
  related_quota:
    scraper_enabled_properties: 250
- id: addingwell
  name: Server-Side Tagging (Addingwell)
  pricing_model: freemium
  description: >-
    Server-side Google Tag Manager product acquired by Didomi, integrated
    with the Didomi consent model for first-party tagging. The ONLY Didomi line
    with a published free tier and a published included volume.
  tiers:
  - name: Free
    price: 0
    currency: null
    billing_period: null
    pricing_model: free
    included_quota: 100,000 requests
    included:
    - Premium private network
    - One-region infrastructure
  - name: Pay As You Go
    price: null
    pricing_model: contact-sales
    included_quota: 2,000,000 requests included
    included:
    - Multi-region infrastructure
    - Tag and data monitoring
    - Premium SLA
  - name: Enterprise
    price: null
    pricing_model: contact-sales
    included_quota: custom request volumes
    included:
    - Multi-region infrastructure
    - Dedicated account manager
    - Annual contract with invoice billing
notes:
- >-
  Didomi publishes tier NAMES and itemised inclusions but no numbers. The only
  published price on the whole offers page is the Server-Side Tagging Free plan
  (100,000 requests, no cost).
- Didomi does not expose a self-serve checkout for the enterprise CMP/PMP.
- >-
  Per the developer docs, "the Consents API and the Integrations are priced
  separately and are not included in your CMP or Preference Center contracts" —
  which means a 403 on /consents/* can be a commercial boundary rather than a
  permissions error.
- >-
  Platform quotas published in the docs (exports_destinations 2,
  scraper_enabled_properties 250, consent_proof_reports 10/month) are the
  machine-readable shadow of these tiers; read them per-organization with
  GET https://api.didomi.io/v1/quotas.
