method: searched
docs: https://developers.didomi.io/api-and-platform/introduction/authentication
source_searched: https://developers.didomi.io/api-and-platform/introduction/authentication
flow:
  style: bearer-jwt
  token_endpoint: POST https://api.didomi.io/v1/sessions
  token_endpoint_auth: none (the credentials are the body)
  request_body:
    type: api-key
    key: the organization's private API key
    secret: the secret issued with that key
  response_field: access_token
  header: 'Authorization: Bearer <access_token>'
  token_ttl_seconds: 3600
  refresh_token: false
  refresh_method: re-POST /sessions
  credential_source: Didomi Console > Settings > Private API keys
  alternate_session_type: >-
    `type: email` authenticates a Console user with an email and password. Use
    api-key for machine access.
  transport: >-
    HTTPS required. Plain HTTP receives a 301 to the HTTPS equivalent, across
    which some clients drop the Authorization header.
  failure_modes:
    invalid_credentials_at_sessions: 400
    missing_or_expired_token: 401
  guidance: >-
    Didomi explicitly recommends caching and reusing the token rather than
    minting one per request, and regenerating it regularly in long-running
    processes.
  oauth2: false
  oidc: false
  scopes: false
  scopes_note: >-
    There are no scopes and no way to mint a reduced-privilege token. A Didomi
    API key grants full access to its organization, so least-privilege must be
    enforced at key issuance in the Console, not at token exchange.
  mtls: false
  webhook_auth:
    direction: inverted
    mode: oauth2-client-credentials
    description: >-
      For OUTBOUND webhooks Didomi authenticates itself against the CUSTOMER's
      authorization server with a client_id/client_secret the customer supplies,
      and presents the resulting token to the customer endpoint as a bearer.
      Source IP is fixed at 35.159.1.63. No payload signature is published.
    source: https://developers.didomi.io/integrations/generic-integrations/webhooks
