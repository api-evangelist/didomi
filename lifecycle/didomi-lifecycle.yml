  - Privacy Centers API
  - AWS cloudfront
  - Compliance Reports
  - Web SDK (Desktop & Mobile)
  - Developers Documentation
  note: >-
    A genuinely well-decomposed status page — 17 separately-tracked components,
    including Webhooks and the Platform API as distinct surfaces, with a
    machine-readable JSON API. This is the strongest lifecycle signal Didomi
    publishes.

sla:
  published: false
  referenced: true
  note: >-
    Didomi references "our Service Level Agreement" in the rate-limiting docs
    for customers needing availability and response-time commitments, but no SLA
    document is published publicly — it is contractual. The rate-limiting page
    states explicitly that rate limits are "not a service level agreement" and
    that the limits "are subject to change at any time without prior
    communication".

changelog:
  artifact: changelog/didomi-changelog.yml
  api_changelog_published: false
  sdk_changelog_published: true

gaps:
- No dated changelog or release notes for the Platform REST API itself.
- No RFC 8594 Sunset / Deprecation headers on any response.
- No published deprecation notice period.
- No published SLA or support-window policy for older SDK majors.
- Web SDK version history carries no dates and the CDN distribution is unpinnable.
- Rate limits are explicitly changeable "without prior communication", which sits awkwardly beside the backwards-compatibility guarantee.
